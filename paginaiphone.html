<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link href="/your-path-to-uicons/css/uicons-rounded-regular.css" rel="stylesheet">
    <link rel="stylesheet" href="fontawesome-free-7.2.0-web/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
    <link rel="stylesheet" href="styleiphone.css">
</head>
<body>
    <div class="teste">
        <img src="teste.svg" class="logo" alt="icone de worten">
        <div class="input-icon input-container">
            <input type="text" id="meuInput" placeholder="O que estás à procura?">
            <span class="clear" onclick="limpar()">X</span>
            <i class="fa-solid fa-magnifying-glass icon"></i>	
        </div>
        <div class="desviar">
            <div class="linha">
                <i class="fa-regular fa-user"></i>
                <p>Olá!<br>Iniciar Sessão</p>
            </div>  
            <i class="fa-solid fa-cart-shopping"></i>
        </div>
    </div>
    <nav class="sidebar">
        <ul>
            <li onclick="abrirModal()"><a href="#"><i class="fa-solid fa-bars"></i>Menu</a></li>
            <li><a href="#">Promoções</a></li>
            <li><a class="caixaazul" href="#">Worten Resolve</a></li>
            <li><a href="#">Cupões para ti</a></li>
            <li><a class="caixavermelha" href="#">Worten Life</a></li>
            <li><a href="#">Dicas e Novidades</a></li>
            <li><a href="#">App Worten</a></li>
            <li><a href="#">Worten Business</a></li>
        </ul>  
    </nav>
    
        
    <section class="produtofinal">
        <div class="puxarlado2">
            <h1>iPhone 17 Pro APPLE (6.3" - 256 GB - Prateado)</h1>
            <img class="imagemclassea" src="imagensprodutos/classA.png" alt="classe a">
            <div class="conteudostar">
                <span>4.8</span>
                <i class="fa-solid fa-star amarelo"></i>
                <i class="fa-solid fa-star amarelo"></i>
                <i class="fa-solid fa-star amarelo"></i>
                <i class="fa-solid fa-star amarelo"></i>
                <div class="imagemparajuntar">
                    <i class="fa-sharp-duotone fa-solid fa-star-half amarelo"></i>
                    <i class="fa-sharp-duotone fa-solid fa-star-half imagemrodado cinzento"></i>
                </div>
                <p>(37 avaliações do produto)</p>
            </div>
            <div class="puxardireita">
                <img src="imagensprodutos/fogueira.png" alt="fogueira">
                <h1>Top Vendas da Semana!</h1>
            </div>
            <div class="imagemacima">
                <button onclick="mudarxImagem1()" class="telaimagem1 esquerda1"><</button>
                 <img data-valor="0" class="imagemprincipal" src="imagensprodutos/iphonev1.jpeg" alt="iamgem selecionada">
                 <button onclick="mudarxImagem2()" class="telaimagem2 direita1">></button>
            </div>
            <div class="regularicones">
                <i class="fa-regular fa-heart acima1"></i>
                <i class="fa-chisel fa-regular fa-compress acima2"></i>
                <i class="fa-solid fa-share-from-square acima3"></i>
            </div>
            <div class="galeria">
                    <img data-valor="0" class="estudio" src="imagensprodutos/iphonev1.jpeg" alt="iphone 1">
                    <img data-valor="1" class="estudio"src="imagensprodutos/iphone2.jpeg" alt="iphone 2">
                    <img data-valor="2" class="estudio" src="imagensprodutos/iphone3.jpeg" alt="iphone 3">
                    <img data-valor="3" class="estudio" src="imagensprodutos/iphone4.jpeg" alt="iphone 4">
                    <img data-valor="4" class="estudio" src="imagensprodutos/iphone5.jpeg" alt="iphone 5">
                </div>
            </div>
        </div>
    </section>











    <script src="script.js"></script>
    <script src="iphone.js"></script>
</body>
</html>
